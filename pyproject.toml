[project]
name = "miggy"
version = "2.5.0"
authors = [
  {name = "Gorshkov Nikolay", email = "nogamemorebrain@gmail.com"},
  {name = "Kirill Klenov"},
  {name = "spumer"},
]
description = "a database migration tool for usage with the peewee ORM"
readme = "README.md"
requires-python = ">=3.10"
classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: BSD License',
    'Natural Language :: English',
    'Natural Language :: Russian',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Software Development :: Testing',
    'Topic :: Utilities',
]
license = "BSD-4-Clause"

dependencies = [
    "peewee>=3.17.9,<4.4",
    "click>=8.3.1",
    "StrEnum; python_version < '3.11'"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "psycopg2-binary>=2.8.1",
    "ruff==0.16.6",
    "poethepoet==0.48.0",
    "mypy==2.3.1",
    "commitizen>=4.13.8,<5"

]
docs = [
    "Sphinx==8.1.3",
    "sphinx-rtd-theme==3.1.0",
    "sphinx-click==6.1.0"
]



[project.urls]
Homepage = "https://github.com/kalombos/miggy"
Issues = "https://github.com/kalombos/miggy/issues"


[project.scripts]
miggy = "miggy.cli:cli"

[build-system]
requires = ["uv_build>=0.9.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "miggy"
module-root = ""

[tool.mypy]
exclude = "(venv|migrations|docs|tests)"
ignore_missing_imports = true


[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"

[tool.ruff]
line-length = 120
exclude = [
    "docs",
]

[tool.ruff.lint]
select = [
    'A',
    'B',
    'C',
    'E',
    'F',
    'G',
    'I',
    'DTZ',
    'UP035',
    'RUF100',
    'TC'
]


[tool.poe.executor]
type = "simple"


[tool.poe.tasks.lint]
help = "Run the type checker"
cmd  = "ruff check"

[tool.poe.tasks.types]
help = "Run the type checker"
cmd  = "mypy ."

[tool.poe.tasks.check_format]
help = "Run the format checker"
cmd  = "ruff format --check"

[tool.poe.tasks.format_by_checker]
help = "Run the check formater"
cmd  = "ruff check --fix-only -e"

[tool.poe.tasks.format_by_formatter]
help = "Run the ruff formatter"
cmd  = "ruff format"

[tool.poe.tasks.format]
help = "Run ruff check and ruff format formatters"
sequence  = ["format_by_checker", "format_by_formatter"]

[tool.poe.tasks.test]
help = "Run tests"
cmd  = "pytest -vv -x"

[tool.poe.tasks.check]
help = "Run all checks on the code base"
sequence = ["lint", "check_format", "types", "test"]
